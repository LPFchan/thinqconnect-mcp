services:
  thinqconnect-mcp:
    build: .
    container_name: thinqconnect-mcp
    user: "1000:1000"
    mem_limit: 256m
    memswap_limit: 256m
    oom_score_adj: 500
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      THINQ_PAT: ${THINQ_PAT:?required}
      THINQ_COUNTRY: ${THINQ_COUNTRY:?required}
      THINQ_AUTH_TOKEN: ${THINQ_AUTH_TOKEN:-}
      ALLOWED_ORIGINS: https://*.lost.plus
